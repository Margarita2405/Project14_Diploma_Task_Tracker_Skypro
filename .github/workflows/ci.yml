name: Django CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - run: pip install flake8
      - run: flake8 .

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run migrations
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 5432
          DATABASE_NAME: postgres
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DEBUG: "True"
          DJANGO_SECRET_KEY: dummy
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost
          CSRF_TRUSTED_ORIGINS: http://localhost
        run: python manage.py migrate
      - name: Run tests
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 5432
          DATABASE_NAME: postgres
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DEBUG: "True"
          DJANGO_SECRET_KEY: dummy
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost
          CSRF_TRUSTED_ORIGINS: http://localhost
        run: python manage.py test

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v3
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
      - name: Build and push
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/tasktracker:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/tasktracker:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << EOF
            cd ~/tasktracker
            git pull origin develop
            cat > .env <<EOL
          DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG=False
          DATABASE_NAME=tasktracker
          DATABASE_USER=postgres
          DATABASE_PASSWORD=qwer7890
          DATABASE_HOST=db
          DATABASE_PORT=5432
          POSTGRES_DB=tasktracker
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=qwer7890
          ADMIN_EMAIL=admin.task@example.ru
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          ALLOWED_HOSTS=${{ secrets.SERVER_IP }}
          CORS_ALLOWED_ORIGINS=http://${{ secrets.SERVER_IP }}
          CSRF_TRUSTED_ORIGINS=http://${{ secrets.CSRF_TRUSTED_ORIGINS }}
          EOL
          docker-compose down
          docker-compose pull
          docker-compose up -d
          docker-compose exec -T web python manage.py migrate
          docker-compose exec -T web python manage.py collectstatic --noinput
          EOF
